<!DOCTYPE html>
<html>
<head>
    <title>Chess Board</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #222;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 70px);
            grid-template-rows: repeat(8, 70px);
            border: 4px solid #333;
        }

        .square {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            cursor: pointer;
        }

        .light {
            background-color: #554f46;
        }

        .dark {
            background-color: #bbb0a6;
        }

        .square:hover {
            background-color: #b4b43a;
        }
    </style>
</head>
<body>

<div class="board">
    <div class="square light">♜</div>
    <div class="square dark">♞</div>
    <div class="square light">♝</div>
    <div class="square dark">♛</div>
    <div class="square light">♚</div>
    <div class="square dark">♝</div>
    <div class="square light">♞</div>
    <div class="square dark">♜</div>

    
    <div class="square dark">♟</div>
    <div class="square light">♟</div>
    <div class="square dark">♟</div>
    <div class="square light">♟</div>
    <div class="square dark">♟</div>
    <div class="square light">♟</div>
    <div class="square dark">♟</div>
    <div class="square light">♟</div>

    
    <div class="square light"></div>
    <div class="square dark"></div>
    <div class="square light"></div>
    <div class="square dark"></div>
    <div class="square light"></div>
    <div class="square dark"></div>
    <div class="square light"></div>
    <div class="square dark"></div>

   
    <div class="square dark"></div>
    <div class="square light"></div>
    <div class="square dark"></div>
    <div class="square light"></div>
    <div class="square dark"></div>
    <div class="square light"></div>
    <div class="square dark"></div>
    <div class="square light"></div>

    
    <div class="square light"></div>
    <div class="square dark"></div>
    <div class="square light"></div>
    <div class="square dark"></div>
    <div class="square light"></div>
    <div class="square dark"></div>
    <div class="square light"></div>
    <div class="square dark"></div>

    
    <div class="square dark"></div>
    <div class="square light"></div>
    <div class="square dark"></div>
    <div class="square light"></div>
    <div class="square dark"></div>
    <div class="square light"></div>
    <div class="square dark"></div>
    <div class="square light"></div>

    
    <div class="square light">♙</div>
    <div class="square dark">♙</div>
    <div class="square light">♙</div>
    <div class="square dark">♙</div>
    <div class="square light">♙</div>
    <div class="square dark">♙</div>
    <div class="square light">♙</div>
    <div class="square dark">♙</div>

    
    <div class="square dark">♖</div>
    <div class="square light">♘</div>
    <div class="square dark">♗</div>
    <div class="square light">♕</div>
    <div class="square dark">♔</div>
    <div class="square light">♗</div>
    <div class="square dark">♘</div>
    <div class="square light">♖</div>
</div>

</body>
</html>
